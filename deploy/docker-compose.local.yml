services:
  backend:
    environment: &backend-environment
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_TLS: "false"

  worker:
    environment: *backend-environment

  absence-worker:
    environment: *backend-environment

  notification-worker:
    environment: *backend-environment

  mongo:
    ports: !override
      - "127.0.0.1:27018:27017"

  nginx:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
