upstream attendance_backend {
    server backend:8000;
}

upstream attendance_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://attendance_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
    }

    location = /webhook/interakt {
        proxy_pass http://attendance_backend/webhook/interakt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://attendance_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
